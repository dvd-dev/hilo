rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register actions.
  appropriate-polling:
    status: done
    comment: Devices and challenges are push (SignalR); only notifications, weather and rewards poll (30 min-2 h).
  brands: done
  common-modules:
    status: todo
    comment: entity.py exists; coordinator.py does not.
  config-flow-test-coverage: todo
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration does not register actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers.
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  entity-event-setup:
    status: todo
    comment: Reward and challenge sensors register SignalR listeners in __init__, not async_added_to_hass.
  entity-unique-id: done
  has-entity-name: todo
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: todo
    comment: Setup raises, but any client error is reported as an auth failure.
  unique-config-entry:
    status: done
    comment: Only one entry is allowed; multiple accounts would need a per-location unique ID.

  # Silver
  action-exceptions:
    status: todo
    comment: Climate raises HomeAssistantError; light and switch let library errors propagate.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters:
    status: done
    comment: Setup is an OAuth login with no other parameters.
  entity-unavailable: todo
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: done
  reauthentication-flow:
    status: done
    comment: Flow exists; no tests and no same-account check yet.
  test-coverage:
    status: todo
    comment: 56% as of 2026-11-01.

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: Cloud-only service with no local discovery.
  discovery:
    status: exempt
    comment: Cloud-only service with no local discovery.
  docs-data-update: todo
  docs-examples:
    status: done
    comment: README links blueprints, automation and dashboard examples.
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class:
    status: todo
    comment: NoiseSensor has no SOUND_PRESSURE device class.
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: todo
    comment: Devices Hilo no longer reports can be deleted manually but are not removed automatically.

  # Platinum
  async-dependency: done
  inject-websession:
    status: todo
    comment: The aiohttp session is injected; python-hilo's GraphQL calls create their own httpx clients.
  strict-typing: todo
