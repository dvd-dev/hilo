[project]
name = "hilo"
version = "2026.10.3"
description = "Home Assistant custom integration for Hilo energy systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "David Vallée Delisle", email = "me@dvd.dev" },
]
keywords = [
    "homeassistant",
    "hilo",
    "hiloenergie",
    "energy",
    "smart-home",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "colorlog>=6.12.0",
    "homeassistant>=2024.4.1",
    "pip>=26.2.2",
    "pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/dvd-dev/hilo"
Repository = "https://github.com/dvd-dev/hilo"
Issues = "https://github.com/dvd-dev/hilo/issues"
Documentation = "https://github.com/dvd-dev/hilo#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_components/hilo"]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "pre-commit>=4.7.0",
    "gitlint>=0.19.1",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-homeassistant-custom-component>=0.13.0",
    "python-hilo==2026.10.2",

    "ruff>=0.17.2",
    "pre-commit>=4.7.0",
    "gitlint>=0.19.1",
    "pyflakes>=4.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".venv",
    ".git",
    ".tox",
    "docs",
    "venv",
    "bin",
    "lib",
    "deps",
    "build",
]

[tool.ruff.lint]
select = [
    "A001",   # Variable {name} is shadowing a Python builtin
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "COM818", # Trailing comma on bare tuple prohibited
    "DTZ003", # Use datetime.now(tz=) instead of datetime.utcnow()
    "DTZ004", # Use datetime.fromtimestamp(ts, tz=) instead of datetime.utcfromtimestamp(ts)
    "DTZ011", # Use datetime.now(tz=).date() instead of date.today()
    "E",      # pycodestyle
    "F",      # pyflakes/autoflake
    "FLY",    # flynt
    "FURB",   # refurb
    "G",      # flake8-logging-format
    "I",      # isort
    "ICN001", # import conventions; {name} should be imported as {asname}
    "ICN002", # import conventions; {name} should not be imported as {asname}
    "INP",    # flake8-no-pep420
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "N804",   # First argument of a class method should be named cls
    "N805",   # First argument of a method should be named self
    "N806",   # Variable {name} in function should be lowercase
    "N815",   # Variable {name} in class scope should not be mixedCase
    "PERF",   # Perflint
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "PYI",    # flake8-pyi
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "S102",   # Use of exec detected
    "S103",   # bad-file-permissions
    "S107",   # Possible hardcoded password assigned to function default
    "S108",   # hardcoded-temp-file
    "S301",   # suspicious-pickle-usage
    "S306",   # suspicious-mktemp-usage
    "S307",   # suspicious-eval-usage
    "S313",   # suspicious-xmlc-element-tree-usage
    "S314",   # suspicious-xml-element-tree-usage
    "S315",   # suspicious-xml-expat-reader-usage
    "S316",   # suspicious-xml-expat-builder-usage
    "S317",   # suspicious-xml-sax-usage
    "S318",   # suspicious-xml-mini-dom-usage
    "S319",   # suspicious-xml-pull-dom-usage
    "S601",   # paramiko-call
    "S602",   # subprocess-popen-with-shell-equals-true
    "S604",   # call-with-shell-equals-true
    "S608",   # hardcoded-sql-expression
    "S609",   # unix-command-wildcard-injection
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "W",      # pycodestyle
]
ignore = [
    "ASYNC109", # Async function definition with a `timeout` parameter
    "ASYNC110", # Use `asyncio.Event` instead of awaiting `asyncio.sleep` in a `while` loop
    "ASYNC240", # Use an async function for entering the file system
    "B008",     # Do not perform function call in argument defaults
    "B019",     # Use of functools.lru_cache or functools.cache on methods can lead to memory leaks
    "D202",     # No blank lines allowed after function docstring
    "D203",     # 1 blank line required before class docstring
    "D213",     # Multi-line docstring summary should start at the second line
    "D406",     # Section name should end with a newline
    "D407",     # Section name underlining
    "D417",     # Missing argument descriptions in docstring
    "E203",     # Whitespace before ':'
    "E501",     # Line too long
    "PLC1901",  # Empty string comparison
    "PLR0911",  # Too many return statements
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments to function call
    "PLR0915",  # Too many statements
    "PLR0917",  # Too many positional arguments defined for a function
    "PLR2004",  # Magic value used in comparison
    "PLW0108",  # Unnecessary lambda wrapping a function call
    "PLW1641",  # __eq__ without __hash__
    "PLW2901",  # Outer variable overwritten by inner target
    "PT011",    # pytest.raises({exception}) is too broad
    "PT018",    # Assertion should be broken down into multiple parts
    "RUF001",   # String contains ambiguous unicode character
    "RUF012",   # Mutable class attributes should be annotated with typing.ClassVar
    "RUF015",   # Prefer next(...) over single element slice
    "RUF043",   # Pattern passed to match= contains metacharacters
    "SIM102",   # Use a single if statement instead of nested if statements
    "SIM103",   # Return the condition directly
    "SIM108",   # Use ternary operator instead of if-else-block
    "SIM115",   # Use context handler for opening files
    "TC001",    # Move application import into a type-checking block
    "TC002",    # Move third-party import into a type-checking block
    "TC003",    # Move standard library import into a type-checking block
    "TC006",    # Add quotes to type expression in typing.cast()
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.hilo", "tests"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]
"tests/*" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
addopts = [
    "-p syrupy",
    "--strict",
    "--cov=custom_components",
]

[tool.coverage.run]
source = ["custom_components"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplemented()",
    "if __name__ == .__main__.:",
    "main()",
]
